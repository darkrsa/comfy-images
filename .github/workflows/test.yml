name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: pip install --quiet -r requirements.txt
      - name: Dockerfiles match models.yaml
        run: python images.py check
      - name: Tests (offline)
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Shell syntax
        run: bash -n ci/*.sh
