# Build the kdp-comfy RunPod serverless worker images (stock worker-comfyui + one family's weights)
# and push them, public, to ghcr.io/darkrsa/kdp-comfy-<family>:{<yyyymmdd>-<shortsha>,latest}.
# Dockerfiles are generated by images.py from models.yaml.
name: build-images

on:
  workflow_dispatch:
    inputs:
      family:
        description: Image family to build
        type: choice
        options: [all, zimage-full, zimage-turbo, flux2klein, trellis2]
        default: all
  push:
    branches: [main]
    paths:
      - docker/**
      - ci/**
      - .github/workflows/build.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explicit: -eo pipefail

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      families: ${{ steps.plan.outputs.families }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dockerfiles match models.yaml
        run: |
          pip install --quiet pyyaml requests
          python images.py check
      - id: plan
        name: Families to build
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.family }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$INPUT" == all ]] && fams="$(python images.py families)" || fams="$INPUT"
          else
            fams="$(bash ci/plan_families.sh "$BEFORE" "$GITHUB_SHA")"
          fi
          json="$(python -c 'import json,sys; print(json.dumps(sys.argv[1:]))' $fams)"
          echo "families=$json" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.families != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.plan.outputs.families) }}
    env:
      FAMILY: ${{ matrix.family }}
      IMAGE: ghcr.io/darkrsa/kdp-comfy-${{ matrix.family }}
      CTX: docker/${{ matrix.family }}
      # gitleaks v8.30.1
      GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Docker storage on the largest free disk
        run: bash ci/docker_storage.sh

      - name: Tags and base
        run: |
          echo "TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >>"$GITHUB_ENV"
          echo "BASE=$(awk '/^FROM /{print $2; exit}' "$CTX/Dockerfile")" >>"$GITHUB_ENV"
          mkdir -p review

      - name: Pull base
        run: docker pull "$BASE"

      - name: Build (downloads + verifies weights from Hugging Face)
        run: |
          start=$(date +%s)
          docker build --progress=plain \
            --build-context fetch=docker/fetch --build-context extras=docker/extras \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" "$CTX" 2>&1 | tee review/build.log
          echo "BUILD_S=$(( $(date +%s) - start ))" >>"$GITHUB_ENV"
          grep -oE 'verified [^ ]+ [0-9]+ [0-9a-f]{64}' review/build.log | tee review/verified.txt
          df -h / /mnt 2>/dev/null || df -h /

      - name: Review manifest (history, files added vs base)
        run: |
          bash ci/image_review.sh "$IMAGE:$TAG" "$BASE" "$FAMILY" review
          cat "review/image-manifest-$FAMILY.txt"   # also in the log, for reviewers without artifact access

      - name: Secret scan (fails the job on any finding)
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD/review:/review" "$GITLEAKS" \
            dir /review/scan --no-banner --redact --exit-code 1 \
            --report-format json --report-path /review/gitleaks-report.json

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (public packages; RunPod templates pin a dated tag, not :latest)
        id: push
        run: |
          start=$(date +%s)
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "PUSH_S=$(( $(date +%s) - start ))" >>"$GITHUB_ENV"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "DIGEST=$digest" >>"$GITHUB_ENV"
          {
            echo
            echo "## pushed"
            echo "$IMAGE:$TAG"
            echo "$digest"
            echo "build ${BUILD_S}s, push ${PUSH_S:-$(( $(date +%s) - start ))}s"
            echo
            echo "## registry layers (compressed bytes, digest)"
            docker buildx imagetools inspect --raw "$digest" \
              | python3 -c 'import json,sys; m=json.load(sys.stdin); [print(l["size"], l["digest"]) for l in m["layers"]]; print("total", sum(l["size"] for l in m["layers"]))'
          } | tee -a "review/image-manifest-$FAMILY.txt"

      - name: Measure compressed weight layers (push failed)
        if: failure() && steps.push.outcome == 'failure'
        run: |
          docker run --rm --network none --entrypoint bash "$IMAGE:$TAG" -c '
            for f in $(find /comfyui/models -name "*.safetensors"); do
              echo "$(stat -c %s "$f") raw, $(gzip -c "$f" | wc -c) gzip-6: $f"
            done' | tee -a "review/image-manifest-$FAMILY.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### kdp-comfy-$FAMILY"
            echo "- tag: \`$IMAGE:${TAG:-?}\`  digest: \`${DIGEST:-not pushed}\`"
            echo "- build ${BUILD_S:-?}s, push ${PUSH_S:-?}s"
            echo '```'
            cat review/verified.txt 2>/dev/null || true
            docker image inspect --format 'uncompressed {{.Size}} bytes' "$IMAGE:${TAG:-x}" 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-manifest-${{ matrix.family }}
          path: |
            review/image-manifest-${{ matrix.family }}.txt
            review/verified.txt
            review/added-files.txt
            review/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
