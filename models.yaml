# Weights for the CR-019 bake-off, laid out for runpod/worker-comfyui 5.10.0.
#
# `path` is relative to a ComfyUI-style root:
# - Docker images (Amendment 1, default): /comfyui, ComfyUI's own base path. ComfyUI v0.34.0
#   folder_paths reads diffusion_models from models/unet + models/diffusion_models and
#   text_encoders from models/text_encoders + models/clip, so UNETLoader / CLIPLoader see them.
# - Optional network volume (LoRA, phase 2): /runpod-volume on workers (worker-comfyui's
#   extra_model_paths.yaml maps `unet: models/unet/`, `clip: models/clip/`), /workspace on pods.
#
# size_gb: from the CI build (bytes / 1e9), used for volume and container-disk sizing.
# sha256: pinned from the CI build (docker/fetch/fetch.py logs the size + sha256 it verified
#   against HF's LFS headers x-linked-size / x-linked-etag). null = take HF's LFS sha256.
# licence_repo: the upstream model card. fetch.py and provision.sh refuse a file whose upstream
#   card does not report `license: apache-2.0` (DECISIONS X2/D3/D5).

datacenter: EU-RO-1
volume_headroom: 0.15

files:
  - name: z_image_bf16
    url: https://huggingface.co/Comfy-Org/z_image/resolve/main/split_files/diffusion_models/z_image_bf16.safetensors
    path: models/unet/z_image_bf16.safetensors
    size_gb: 12.31
    sha256: 996a67d3ff666946b1c25cbc16d1b1918b6cc0ac166309e23fe3b3d830263dee  # CI run 45249729372, 12309866400 bytes
    licence: apache-2.0
    licence_repo: Tongyi-MAI/Z-Image
    licence_url: https://huggingface.co/Tongyi-MAI/Z-Image

  - name: z_image_turbo_bf16
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_bf16.safetensors
    path: models/unet/z_image_turbo_bf16.safetensors
    size_gb: 12.31
    sha256: 2407613050b809ffdff18a4ac99af83ea6b95443ecebdf80e064a79c825574a6  # CI run 45249729372, 12309866400 bytes
    licence: apache-2.0
    licence_repo: Tongyi-MAI/Z-Image-Turbo
    licence_url: https://huggingface.co/Tongyi-MAI/Z-Image-Turbo

  # Qwen3-4B text encoder for Z-Image (CLIPLoader type `lumina2`).
  - name: qwen_3_4b
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors
    path: models/clip/qwen_3_4b.safetensors
    size_gb: 8.04
    sha256: 6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a  # CI run 45249729372, 8044982048 bytes
    licence: apache-2.0
    licence_repo: Tongyi-MAI/Z-Image-Turbo
    licence_url: https://huggingface.co/Qwen/Qwen3-4B

  - name: z_image_vae
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/vae/ae.safetensors
    path: models/vae/ae.safetensors
    size_gb: 0.34
    sha256: afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38  # CI run 45249729372, 335304388 bytes
    licence: apache-2.0
    licence_repo: Tongyi-MAI/Z-Image-Turbo
    licence_url: https://huggingface.co/Tongyi-MAI/Z-Image-Turbo

  # Distilled (4-step) klein 4B, as in Comfy-Org/workflow_templates image_flux2_klein_text_to_image.
  - name: flux2_klein_4b
    url: https://huggingface.co/Comfy-Org/flux2-klein/resolve/main/split_files/diffusion_models/flux-2-klein-4b.safetensors
    path: models/unet/flux-2-klein-4b.safetensors
    size_gb: 7.75
    sha256: ec3d4e733a771f61c052fb4856c48b336c55eaf2c65487c2a1faeb9bbda7a343  # CI run 45249729372, 7751105712 bytes
    licence: apache-2.0
    licence_repo: black-forest-labs/FLUX.2-klein-4B
    licence_url: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B

  # FLUX.2 klein's own Qwen3-4B text encoder (CLIPLoader type `flux2`), from the Apache klein
  # repo the official ComfyUI klein template links. CI showed it is byte-identical to the
  # Z-Image TE (same sha256); kept as its own entry so each family's source + licence card
  # stays its own.
  - name: qwen_3_4b_klein
    url: https://huggingface.co/Comfy-Org/flux2-klein/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors
