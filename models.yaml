# Weights for the CR-019 bake-off, laid out for runpod/worker-comfyui 5.10.0.
#
# `path` is relative to a ComfyUI-style root:
# - Docker images (Amendment 1, default): /comfyui, ComfyUI's own base path. ComfyUI v0.34.0
#   folder_paths reads diffusion_models from models/unet + models/diffusion_models and
#   text_encoders from models/text_encoders + models/clip, so UNETLoader / CLIPLoader see them.
# - Optional network volume (LoRA, phase 2): /runpod-volume on workers (worker-comfyui's
#   extra_model_paths.yaml maps `unet: models/unet/`, `clip: models/clip/`), /workspace on pods.
#
# size_gb: from the CI build (bytes / 1e9), used for volume and container-disk sizing.
# sha256: pinned from the CI build (docker/fetch/fetch.py logs the size + sha256 it verified
#   against HF's LFS headers x-linked-size / x-linked-etag). null = take HF's LFS sha256.
# licence: what the upstream card (licence_repo) must report; fetch.py refuses the file otherwise.
#   For a card with `license: other` this is its `license_name`. images.py refuses to render a
#   licence that is not in approved_licences.
# licence_files: texts under docker/extras/licenses/ the licence requires to travel with the weights;
#   copied into the image at /licenses/.

# Licences the owner approved for public images (div-skills: anything not Apache-2.0 needs the
# owner's explicit ok). Adding one here is that approval; say who and when.
approved_licences:
  apache-2.0: DECISIONS X2/D3/D5
  mit: Sergey, 2026-11-24 (TRELLIS.2, BiRefNet)
  dinov3-license: Sergey, 2026-11-24 (DINOv3 image encoder of TRELLIS.2; ship the licence text)

