families:
  zimage-full:
    files: [z_image_bf16, qwen_3_4b, z_image_vae]
  zimage-turbo:
    files: [z_image_turbo_bf16, qwen_3_4b, z_image_vae]
  flux2klein:
    files: [flux2_klein_4b, qwen_3_4b_klein, flux2_vae]
  # Image -> textured GLB. `handler: outputs` swaps in docker/extras/handler.py, which returns
  # files of every output kind (the stock handler drops SaveGLB's `3d` output).
  # Z-Image Turbo + its Fun ControlNet Union: pose/depth/canny from 3D renders. A family of its own
  # so the bake-off's zimage-turbo image stays unchanged.
  zimage-turbo-cn:
    files: [z_image_turbo_bf16, qwen_3_4b, z_image_vae, z_image_turbo_fun_controlnet_union]
  # Image + prompt -> video (SaveVideo mp4), returned by the all-outputs handler.
  wan22-5b:
    handler: outputs
    files: [wan2_2_ti2v_5b_fp16, umt5_xxl_fp8, wan2_2_vae]
  trellis2:
    handler: outputs
    files: [trellis_2_int8_convrot, trellis_2_shape_vae_bf16, trellis_2_texture_vae_bf16,
            dino_v3_vit_l, birefnet]
  # Work pod (not serverless): the trellis2 weights + all-outputs handler + headless Blender
  # (`blender -b`), so a pod can be deleted and recreated without manual setup. Start the pod with
  # SERVE_API_LOCALLY=true to reach ComfyUI on port 8188; keep work files in R2, not on a volume.
  trellis2-pod:
    handler: outputs
    files: [trellis_2_int8_convrot, trellis_2_shape_vae_bf16, trellis_2_texture_vae_bf16,
            dino_v3_vit_l, birefnet]
    tools: [blender]
  # Lipsync: portrait + speech audio -> talking video (mp4), all-outputs handler. The 14B model is
  # baked as 2 layers and joined at start: container disk 37 GB (images.container_disk_gb).
  wan22-s2v:
    handler: outputs
    files: [wan2_2_s2v_14b_fp8, wav2vec2_large_english_fp16, umt5_xxl_fp8, wan_2_1_vae,
            wan2_2_lightx2v_4steps_high_noise]
  wan21-infinitetalk:
    handler: outputs
    files: [wan2_1_i2v_480p_14b_fp8, wan2_1_infinitetalk_multi_fp16, wav2vec2_chinese_base_fp16,
            umt5_xxl_fp8, wan_2_1_vae, lightx2v_i2v_480p_rank64]

  # Reference image(s) + instruction -> edited image (character in a new pose/scene). The 20.5 GB
  # model is baked as 3 layers and joined at start (container disk from images.container_disk_gb).
  qwen-image-edit:
    handler: outputs
    files: [qwen_image_edit_2511_fp8mixed, qwen_2_5_vl_7b_fp8, qwen_image_vae,
            qwen_image_edit_2511_lightning_4steps]

# Bake-off profiles → files they need (by name) and sampler settings. workflows.py builds them.
profiles:
  zimage_full:
    family: zimage-full
    builder: zimage
    files: [z_image_bf16, qwen_3_4b, z_image_vae]
    steps: 30
    cfg: 4.0
    sampler: euler
    scheduler: simple
    negative: true
  zimage_turbo:
    family: zimage-turbo
    builder: zimage
    files: [z_image_turbo_bf16, qwen_3_4b, z_image_vae]
    steps: 8
    cfg: 1.0
    sampler: euler
    scheduler: simple
    negative: false
  flux2_klein4b:
    family: flux2klein
    builder: flux2_klein
    files: [flux2_klein_4b, qwen_3_4b_klein, flux2_vae]
    steps: 4
    cfg: 1.0
    sampler: euler
    negative: false

# Optional phase-2 file, uploaded from the operator's disk by upload_lora.py (not downloaded).
lora:
  path: models/loras/mndymood_zimage_v01.safetensors
  strength: 0.8
