  # FLUX.2 VAE from the Apache klein-4B ComfyUI repo, not the flux2-dev rehost (orchestrator
  # note, REPORT risk 7).
  - name: flux2_vae
    url: https://huggingface.co/Comfy-Org/flux2-klein-4B/resolve/main/split_files/vae/flux2-vae.safetensors
    path: models/vae/flux2-vae.safetensors
    size_gb: 0.34
    sha256: 868fe7b343cc8f3a19dbcfcafbc3d5f888802be3f89bd81b65b3621a066ce8f3  # CI run 45249729372, 336211292 bytes
